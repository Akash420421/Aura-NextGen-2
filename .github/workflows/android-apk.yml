name: Build Aura AI APK

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Restore stable debug signing key
        env:
          AURA_DEBUG_KEYSTORE_BASE64: ${{ secrets.AURA_DEBUG_KEYSTORE_BASE64 }}
          AURA_DEBUG_STORE_PASSWORD: ${{ secrets.AURA_DEBUG_STORE_PASSWORD }}
          AURA_DEBUG_KEY_PASSWORD: ${{ secrets.AURA_DEBUG_KEY_PASSWORD }}
        run: |
          test -n "$AURA_DEBUG_KEYSTORE_BASE64"
          test -n "$AURA_DEBUG_STORE_PASSWORD"
          test -n "$AURA_DEBUG_KEY_PASSWORD"
          printf '%s' "$AURA_DEBUG_KEYSTORE_BASE64" | base64 --decode > app/aura-debug.jks

      - name: Build standalone Aura AI APK
        env:
          AURA_DEBUG_STORE_PASSWORD: ${{ secrets.AURA_DEBUG_STORE_PASSWORD }}
          AURA_DEBUG_KEY_PASSWORD: ${{ secrets.AURA_DEBUG_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleStandardDebug

      - name: Prepare Release Assets
        run: |
          mkdir -p release_assets
          cp app/build/outputs/apk/standard/debug/*.apk release_assets/AuraAI-v2.1.6-release.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Aura-AI-APK
          path: release_assets/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: v2.1.6
          name: Aura AI v2.1.6
          body: |
            ### Aura AI v2.1.6 — Upstream AntiGem Voice Call Sync, Chat Scroll Smoothness & Aura Gallery Filter
            - **Voice Call Upstream Sync:** Clean port of upstream AntiGem voice calling architecture, protocols and preview components.
            - **Chat Feed Smooth Scrolling:** Removed per-block touch gesture interceptors and guarded layout measurements to eliminate scroll lag and stutter.
            - **Aura-Only Image Gallery:** Filtered gallery to strictly show Aura-generated images, excluding device photos and user-uploaded media.
            - **Restored Assistant Message Actions:** Footer controls for copying, retry, and details seamlessly rendered below assistant responses.
          files: release_assets/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
