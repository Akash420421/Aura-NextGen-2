name: Build Aura AI APK

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Restore stable debug signing key
        env:
          AURA_DEBUG_KEYSTORE_BASE64: ${{ secrets.AURA_DEBUG_KEYSTORE_BASE64 }}
          AURA_DEBUG_STORE_PASSWORD: ${{ secrets.AURA_DEBUG_STORE_PASSWORD }}
          AURA_DEBUG_KEY_PASSWORD: ${{ secrets.AURA_DEBUG_KEY_PASSWORD }}
        run: |
          test -n "$AURA_DEBUG_KEYSTORE_BASE64"
          test -n "$AURA_DEBUG_STORE_PASSWORD"
          test -n "$AURA_DEBUG_KEY_PASSWORD"
          printf '%s' "$AURA_DEBUG_KEYSTORE_BASE64" | base64 --decode > app/aura-debug.jks

      - name: Build standalone Aura AI APK
        env:
          AURA_DEBUG_STORE_PASSWORD: ${{ secrets.AURA_DEBUG_STORE_PASSWORD }}
          AURA_DEBUG_KEY_PASSWORD: ${{ secrets.AURA_DEBUG_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleStandardDebug

      - name: Prepare Release Assets
        run: |
          mkdir -p release_assets
          cp app/build/outputs/apk/standard/debug/*.apk release_assets/AuraAI-v2.0.8-release.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Aura-AI-APK
          path: release_assets/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: v2.1.1
          name: Aura AI v2.1.1
          body: |
            ### Aura AI v2.1.1 — Voice Screen Polish, Native Screen Share & Language Picker
            - **Voice Screen Greeting & Polish:** Responsive greeting title with user name interpolation and live status states (Listening, Thinking, Speaking).
            - **Instant Voice Start:** Tapping 'Tap to Start' directly initiates voice conversation without setup detours.
            - **Voice Spoken Language Picker:** Tapping the Language button opens a quick modal with Auto Detect, English, Hindi, and multi-language support.
            - **Hardware Screen Share Integration:** Full MediaProjection screen sharing based on Playlist_part7 with active sharing indicator and toggle.
            - **Drawer Voice Setting Action:** Added 'Voice Setting' entry in the sidebar More section for quick access to speech settings.
          files: release_assets/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
