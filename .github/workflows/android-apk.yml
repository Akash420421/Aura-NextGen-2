name: Build Aura AI APK

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Restore stable debug signing key
        env:
          AURA_DEBUG_KEYSTORE_BASE64: ${{ secrets.AURA_DEBUG_KEYSTORE_BASE64 }}
          AURA_DEBUG_STORE_PASSWORD: ${{ secrets.AURA_DEBUG_STORE_PASSWORD }}
          AURA_DEBUG_KEY_PASSWORD: ${{ secrets.AURA_DEBUG_KEY_PASSWORD }}
        run: |
          test -n "$AURA_DEBUG_KEYSTORE_BASE64"
          test -n "$AURA_DEBUG_STORE_PASSWORD"
          test -n "$AURA_DEBUG_KEY_PASSWORD"
          printf '%s' "$AURA_DEBUG_KEYSTORE_BASE64" | base64 --decode > app/aura-debug.jks

      - name: Build standalone Aura AI APK
        env:
          AURA_DEBUG_STORE_PASSWORD: ${{ secrets.AURA_DEBUG_STORE_PASSWORD }}
          AURA_DEBUG_KEY_PASSWORD: ${{ secrets.AURA_DEBUG_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleStandardDebug

      - name: Prepare Release Assets
        run: |
          mkdir -p release_assets
          cp app/build/outputs/apk/standard/debug/*.apk release_assets/AuraAI-v2.0.7-release.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Aura-AI-APK
          path: release_assets/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: v2.0.7
          name: Aura AI v2.0.7
          body: |
            ### Aura AI v2.0.7 — Compact Elevated Sidebar & Permanent Porcelain Theme
            - **Compact Gemini-Style Menu:** 44dp slim rows with 6dp spacing, outlined Material icons, and 14dp rounded cards.
            - **Expandable More Section:** Clean 'More' menu item with rotating chevron revealing Plugins.
            - **Manrope SemiBold Header:** Bundled Manrope font for "Aura AI" header with 48dp soft elevated search button.
            - **Refined Footer:** Balanced layout with 48dp Settings gear, centered Accounts pill, and 48dp 3-dots overflow menu.
            - **Unified Soft 3D Elevation:** Consistent dual-layer ambient/spot shadows and subtle borders across all cards.
            - **Permanent Porcelain Theme:** Default pure light mode with Porcelain palette across the entire app.
          files: release_assets/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
