name: Build Aura AI APK

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Restore stable debug signing key
        env:
          AURA_DEBUG_KEYSTORE_BASE64: ${{ secrets.AURA_DEBUG_KEYSTORE_BASE64 }}
          AURA_DEBUG_STORE_PASSWORD: ${{ secrets.AURA_DEBUG_STORE_PASSWORD }}
          AURA_DEBUG_KEY_PASSWORD: ${{ secrets.AURA_DEBUG_KEY_PASSWORD }}
        run: |
          test -n "$AURA_DEBUG_KEYSTORE_BASE64"
          test -n "$AURA_DEBUG_STORE_PASSWORD"
          test -n "$AURA_DEBUG_KEY_PASSWORD"
          printf '%s' "$AURA_DEBUG_KEYSTORE_BASE64" | base64 --decode > app/aura-debug.jks

      - name: Build standalone Aura AI APK
        env:
          AURA_DEBUG_STORE_PASSWORD: ${{ secrets.AURA_DEBUG_STORE_PASSWORD }}
          AURA_DEBUG_KEY_PASSWORD: ${{ secrets.AURA_DEBUG_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleStandardDebug

      - name: Prepare Release Assets
        run: |
          mkdir -p release_assets
          cp app/build/outputs/apk/standard/debug/*.apk release_assets/AuraAI-v2.0.5-release.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Aura-AI-APK
          path: release_assets/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: v2.0.5
          name: Aura AI v2.0.5
          body: |
            ### Aura AI v2.0.5 — PRoot Ubuntu Engine, Pure White Theme & Refined Sidebar
            - **PRoot Ubuntu 24.04 Engine:** Fixed package isolation check so standalone `com.aura.ai` downloads lightweight Ubuntu rootfs (35MB) and executes under PRoot glibc. Completely resolves `libandroid-support.so not found` during bootstrap shell verification.
            - **Local AI Engine Auto-Start:** Seamless daemon launch on isolated ports 1244/1245 upon rootfs verification, eliminating "Antigravity is stopped" and connection refused errors.
            - **Pure White / Light Theme Everywhere:** Dark theme completely eliminated across screens, settings, dialogs, drawers, and menus. Status and navigation bar icons are dark everywhere for crisp readability.
            - **Refined Sidebar:** Sidebar container background matches the Chat and Voice screens' off-white token (`MaterialTheme.colorScheme.background`), 28dp rounded right corners with edge shadow, 24sp SemiBold Aura AI header, and 44dp circular elevated search button.
            - **Soft 3D Elevated Elements:** White elevated 52dp menu cards (Images, Customize, Projects, Tasks, Plugins) with 10dp gap, 48dp gear and teal avatar, and 44dp blue text Retry pill.
          files: release_assets/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
